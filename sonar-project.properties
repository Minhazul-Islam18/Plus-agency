# SonarQube / SonarCloud project configuration
# https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

sonar.projectKey=ica
sonar.projectName=ica
sonar.projectVersion=1.0

# Laravel app lives in core/; assets/ is hand-maintained front-end, installer/ is a one-time setup wizard
sonar.sources=core/app,core/config,core/database,core/routes,core/resources
sonar.tests=core/tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  core/vendor/**,\
  core/node_modules/**,\
  core/public/**,\
  core/storage/**,\
  core/bootstrap/cache/**,\
  assets/**,\
  installer/**,\
  backups/**

sonar.test.exclusions=core/vendor/**

# Translation files (~80 languages) are structurally near-identical by
# design (same keys, translated values) — that's not code duplication in
# any actionable sense, just how Laravel localization works. Excluding
# them from CPD keeps the duplication metric meaningful.
sonar.cpd.exclusions=core/resources/lang/**

# Generate before each scan: cd core && XDEBUG_MODE=coverage php vendor/bin/phpunit --coverage-clover coverage.xml
sonar.php.coverage.reportPaths=core/coverage.xml
